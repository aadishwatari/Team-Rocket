<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSIFIED DATABASE</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Courier New', Courier, 'Lucida Console', monospace;
letter-spacing: 1.5px; /* Typewriter feel */
}
body{
height:100vh;
overflow:hidden;
background:
linear-gradient(rgba(80,20,20,.92), rgba(60,10,10,.92)),
url("https://www.transparenttextures.com/patterns/old-paper.png");
background-size:cover;
position:relative;
}
/* Film Grain */
body::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/noise-pattern-with-subtle-cross-lines.png");
opacity:.15;
pointer-events:none;
}
/* Header */
.header{
position:absolute;
top:30px;
width:100%;
text-align:center;
font-size:2rem;
font-weight:bold;
letter-spacing:6px;
color:#f5e8c7;
animation:blink 2s infinite;
text-shadow: 0 0 8px #800000;
}
/* Folder Container */
.folder-area{
width:100%;
height:100%;
position:relative;
}
/* Folder */
.folder{
position:absolute;
width:220px;
height:130px;
background:#9c2f2f;
border:3px solid #5c1a1a;
border-radius:5px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:18px;
color:#f5e8c7;
box-shadow:0 10px 20px rgba(0,0,0,.4);
transition:.3s;
animation:float 3.2s ease-in-out infinite; /* Faster floating */
}
.folder::before{
content:"";
position:absolute;
top:-15px;
left:15px;
width:70px;
height:20px;
background:#b53a3a;
border:3px solid #5c1a1a;
border-bottom:none;
border-radius:4px 4px 0 0;
}
.folder:hover{
transform:translateY(-10px) scale(1.05);
}
/* Faster Floating Animation */
@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-18px);
}
}
/* Folder Positions */
.f1{top:18%; left:10%;}
.f2{top:55%; left:12%;}
.f3{top:30%; left:38%;}
.f4{top:65%; left:40%;}
.f5{top:20%; right:12%;}
.f6{top:55%; right:10%;}

/* Notifications */
.notification{
position:absolute;
right:-500px;
padding:15px 20px;
background:#2b0a0a;
color:#ff9999;
border-left:5px solid #ff3333;
font-size:14px;
transition:.8s;
z-index:999;
letter-spacing:1px;
}
/* Screen flicker */
.flicker{
position:absolute;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
animation:flicker .15s infinite;
}
@keyframes flicker{
0%,95%,100%{ opacity:0; }
96%{ opacity:.04; }
}



</style>
</head>

<script>

setInterval(() => {

    document.body.style.filter =
        `hue-rotate(${Math.random()*20-10}deg)
         contrast(${1+Math.random()*0.5})
         brightness(${0.9+Math.random()*0.2})`;

},100);

setInterval(() => {

    const glitch = document.createElement("div");

    glitch.style.position = "fixed";
    glitch.style.left = "0";
    glitch.style.top = Math.random()*100+"%";
    glitch.style.width = "100%";
    glitch.style.height = Math.random()*30+5+"px";

    glitch.style.background =
    "rgba(255,0,0,0.25)";

    glitch.style.zIndex = "99999";

    document.body.appendChild(glitch);

    setTimeout(()=>{
        glitch.remove();
    },100);

},1500);

</script>

<body>
<div class="flicker"></div>
<div class="header">
CLASSIFIED DATABASE
</div>
<div class="folder-area">
<div class="folder f1" onclick="location.href='targets.html'">
[TARGET FILES]
</div>
<div class="folder f2" onclick="location.href='reports.html'">
[OPERATION REPORTS]
</div>
<div class="folder f3" onclick="location.href='experiments.html'">
[EXPERIMENTS]
</div>
<div class="folder f4" onclick="location.href='watchlist.html'">
[WATCHLIST]
</div>
<div class="folder f5" onclick="location.href='archives.html'">
[ARCHIVES]
</div>
<div class="folder f6" onclick="location.href='restricted.html'">
[RESTRICTED]
</div>
</div>

<script>
const warnings = [
"WARNING: DO NOT CONTINUE",
"SURVEILLANCE ACTIVE",
"YOUR DEVICE HAS BEEN FLAGGED",
"UNKNOWN ENTITY DETECTED",
"CULT DATABASE ACCESSED",
"RESTRICTED ARCHIVE OPENED",
"THEY KNOW YOU ARE HERE",
"UNAUTHORIZED INVESTIGATION",
"SUBJECT ADDED TO WATCHLIST",
"CONNECTION MONITORED",
"YOU WERE NEVER SUPPOSED TO FIND THIS",
"CLASSIFIED MATERIAL VIEWED",
"ARCHIVE CORRUPTION DETECTED",
"MEMETIC HAZARD POSSIBLE"
];
function spawnNotification(){
const box = document.createElement("div");
box.className = "notification";
box.style.top = Math.random()*80 + 10 + "%";
box.innerText = warnings[Math.floor(Math.random()*warnings.length)];
document.body.appendChild(box);
setTimeout(()=>{ box.style.right="20px"; },100);
setTimeout(()=>{ box.style.right="-500px"; },3500);
setTimeout(()=>{ box.remove(); },4500);
}
setInterval(spawnNotification, 2500);
</script>

<script>

// Create glitch overlay
const glitch = document.createElement("div");

glitch.style.position = "fixed";
glitch.style.top = "0";
glitch.style.left = "0";
glitch.style.width = "100%";
glitch.style.height = "100%";
glitch.style.pointerEvents = "none";
glitch.style.zIndex = "99999";

document.body.appendChild(glitch);

// Main glitch loop

setInterval(() => {

    // Screen shake
    document.body.style.transform =
        `translate(
            ${(Math.random()-0.5)*10}px,
            ${(Math.random()-0.5)*10}px
        )`;

    // Brightness flicker
    document.body.style.filter =
        `brightness(${0.8 + Math.random()*0.5})
         contrast(${1 + Math.random()*0.5})`;

    // Random glitch bar
    const bar = document.createElement("div");

    bar.style.position = "absolute";
    bar.style.left = "0";
    bar.style.top = Math.random()*window.innerHeight + "px";
    bar.style.width = "100%";
    bar.style.height = (Math.random()*40+10) + "px";

    bar.style.background =
        `rgba(255,0,0,${Math.random()*0.4})`;

    glitch.appendChild(bar);

    setTimeout(()=>{
        bar.remove();
    },150);

},120);


// Bigger glitch every few seconds

setInterval(() => {

    document.body.style.transform =
        `translate(
            ${(Math.random()-0.5)*40}px,
            ${(Math.random()-0.5)*20}px
        )`;

    document.body.style.filter =
        `hue-rotate(${Math.random()*40-20}deg)
         brightness(1.4)
         contrast(2)`;

    setTimeout(() => {

        document.body.style.transform = "";
        document.body.style.filter = "";

    },200);

},3000);


// Random static flash

setInterval(() => {

    glitch.style.background =
        `rgba(255,255,255,${Math.random()*0.15})`;

    setTimeout(() => {
        glitch.style.background = "transparent";
    },50);

},500);

</script>

</body>
</html>
